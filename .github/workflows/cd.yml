name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-manifests:
    name: Bump K8s image tags (registry versions)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.event.workflow_run.head_sha }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Read versions and update production overlay
        id: tags
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE || 'tsermakov' }}
        run: |
          chmod +x scripts/version.sh scripts/kustomize-set-image-tags.sh
          ./scripts/kustomize-set-image-tags.sh production "${NAMESPACE}"
          echo "backend_tag=$(scripts/version.sh image-tag user-account-srv)" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$(scripts/version.sh image-tag frontend)" >> "$GITHUB_OUTPUT"
          echo "ai_tag=$(scripts/version.sh image-tag ai-srv)" >> "$GITHUB_OUTPUT"
          echo "Images in registry (pull by these tags):"
          echo "  ${NAMESPACE}/actium-user-account-srv:$(scripts/version.sh image-tag user-account-srv)"
          echo "  ${NAMESPACE}/actium-templater-frontend:$(scripts/version.sh image-tag frontend)"
          echo "  ${NAMESPACE}/actium-ai-srv:$(scripts/version.sh image-tag ai-srv)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/production/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes (tags already match versions.yaml)"
            exit 0
          fi
          git commit -m "chore(cd): sync production images to versions.yaml (backend=${{ steps.tags.outputs.backend_tag }} frontend=${{ steps.tags.outputs.frontend_tag }} ai=${{ steps.tags.outputs.ai_tag }})"
          git push origin HEAD:master

      - name: Check Telegram configured
        id: tg
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Telegram secrets not set, skipping notification"
          fi

      - name: Notify Telegram on CD success
        if: success() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@v1.0.0
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            CD ok — production kustomize synced to versions.yaml
            backend=${{ steps.tags.outputs.backend_tag }} frontend=${{ steps.tags.outputs.frontend_tag }} ai=${{ steps.tags.outputs.ai_tag }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  create-release-tags:
    name: Create release tags from versions.yaml
    runs-on: ubuntu-latest
    needs: bump-manifests
    if: >
      needs.bump-manifests.result == 'success' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Create and push service tags when versions changed
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [ -z "${TARGET_SHA}" ]; then
            echo "Missing workflow_run.head_sha, skipping tag creation."
            exit 0
          fi

          if ! git rev-parse --verify "${TARGET_SHA}" >/dev/null 2>&1; then
            echo "Target commit not found: ${TARGET_SHA}"
            exit 1
          fi

          if ! git rev-parse --verify "${TARGET_SHA}^" >/dev/null 2>&1; then
            echo "No parent commit for target ${TARGET_SHA}, skipping tag creation."
            exit 0
          fi

          if git diff --quiet "${TARGET_SHA}^" "${TARGET_SHA}" -- versions.yaml; then
            echo "versions.yaml was not changed in target commit ${TARGET_SHA}."
            exit 0
          fi

          mapfile -t CANDIDATE_TAGS < <(python3 - <<'PY'
          import re
          import subprocess
          import os

          SERVICE_PREFIX = {
              "user-account-srv": "backend",
              "frontend": "frontend",
              "ai-srv": "ai",
          }
          target_sha = os.environ["TARGET_SHA"]

          def parse_versions(text: str) -> dict[str, str]:
              result = {}
              pattern = re.compile(
                  r'^\s*(user-account-srv|frontend|ai-srv)\s*:\s*["\']?([0-9]+\.[0-9]+\.[0-9]+)["\']?\s*$'
              )
              for line in text.splitlines():
                  match = pattern.match(line)
                  if match:
                      result[match.group(1)] = match.group(2)
              return result

          current = subprocess.check_output(["git", "show", f"{target_sha}:versions.yaml"], text=True)
          previous = subprocess.check_output(["git", "show", f"{target_sha}^:versions.yaml"], text=True)

          current_versions = parse_versions(current)
          previous_versions = parse_versions(previous)

          for service, prefix in SERVICE_PREFIX.items():
              current_version = current_versions.get(service)
              previous_version = previous_versions.get(service)
              if current_version and current_version != previous_version:
                  print(f"{prefix}/v{current_version}")
          PY
          )

          if [ "${#CANDIDATE_TAGS[@]}" -eq 0 ]; then
            echo "No service version changed in versions.yaml."
            exit 0
          fi

          TAGS_TO_PUSH=()
          for TAG in "${CANDIDATE_TAGS[@]}"; do
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag already exists in remote, skipping: ${TAG}"
              continue
            fi

            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag already exists locally, skipping create: ${TAG}"
            else
              git tag "${TAG}" "${TARGET_SHA}"
              echo "Created tag: ${TAG}"
            fi
            TAGS_TO_PUSH+=("${TAG}")
          done

          if [ "${#TAGS_TO_PUSH[@]}" -eq 0 ]; then
            echo "No new tags to push."
            exit 0
          fi

          git push origin "${TAGS_TO_PUSH[@]}"
          echo "Pushed tags: ${TAGS_TO_PUSH[*]}"
