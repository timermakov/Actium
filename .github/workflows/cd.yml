name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump-manifests:
    name: Bump K8s image tags (registry versions)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master'
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'master' || github.event.workflow_run.head_sha }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Read versions and update production overlay
        id: tags
        env:
          NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE || 'tsermakov' }}
        run: |
          chmod +x scripts/version.sh scripts/kustomize-set-image-tags.sh
          ./scripts/kustomize-set-image-tags.sh production "${NAMESPACE}"
          echo "backend_tag=$(scripts/version.sh image-tag user-account)" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$(scripts/version.sh image-tag frontend)" >> "$GITHUB_OUTPUT"
          echo "ai_tag=$(scripts/version.sh image-tag ai-backend)" >> "$GITHUB_OUTPUT"
          echo "Images in registry (pull by these tags):"
          echo "  ${NAMESPACE}/actium-user-account-backend:$(scripts/version.sh image-tag user-account)"
          echo "  ${NAMESPACE}/actium-templater-frontend:$(scripts/version.sh image-tag frontend)"
          echo "  ${NAMESPACE}/actium-ai-backend:$(scripts/version.sh image-tag ai-backend)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/production/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No manifest changes (tags already match versions.yaml)"
            exit 0
          fi
          git commit -m "chore(cd): sync production images to versions.yaml (backend=${{ steps.tags.outputs.backend_tag }} frontend=${{ steps.tags.outputs.frontend_tag }} ai=${{ steps.tags.outputs.ai_tag }})"
          git push

      - name: Check Telegram configured
        id: tg
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Telegram secrets not set, skipping notification"
          fi

      - name: Notify Telegram on CD success
        if: success() && steps.tg.outputs.enabled == 'true'
        uses: appleboy/telegram-action@v1.0.0
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            CD ok — production kustomize synced to versions.yaml
            backend=${{ steps.tags.outputs.backend_tag }} frontend=${{ steps.tags.outputs.frontend_tag }} ai=${{ steps.tags.outputs.ai_tag }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
