name: Release

on:
  push:
    tags:
      - "backend/v[0-9]+.[0-9]+.[0-9]+"
      - "frontend/v[0-9]+.[0-9]+.[0-9]+"
      - "ai/v[0-9]+.[0-9]+.[0-9]+"
      - "release/v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  VITE_API_BASE_URL: /api/user
  COVERAGE_THRESHOLD: 80

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.meta.outputs.scope }}
      service: ${{ steps.meta.outputs.service }}
      version: ${{ steps.meta.outputs.version }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
      backend_tag: ${{ steps.meta.outputs.backend_tag }}
      frontend_tag: ${{ steps.meta.outputs.frontend_tag }}
      ai_tag: ${{ steps.meta.outputs.ai_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse tag and versions.yaml
        id: meta
        env:
          DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          chmod +x scripts/version.sh
          REF="${GITHUB_REF#refs/tags/}"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

          if [[ "${REF}" =~ ^backend/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            SCOPE="single"
            SERVICE="user-account"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${REF}" =~ ^frontend/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            SCOPE="single"
            SERVICE="frontend"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${REF}" =~ ^ai/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            SCOPE="single"
            SERVICE="ai-backend"
            VERSION="${BASH_REMATCH[1]}"
          elif [[ "${REF}" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            SCOPE="all"
            SERVICE="all"
            VERSION="${BASH_REMATCH[1]}"
          else
            echo "Unsupported tag: ${REF}"
            exit 1
          fi

          if [ "${SCOPE}" = "single" ]; then
            FILE_VER="$(scripts/version.sh show "${SERVICE}")"
            if [ "${FILE_VER}" != "${VERSION}" ]; then
              echo "Tag ${REF} expects versions.yaml ${SERVICE}=${VERSION}, got ${FILE_VER}"
              exit 1
            fi
          fi

          BACKEND_TAG="v$(scripts/version.sh show user-account)"
          FRONTEND_TAG="v$(scripts/version.sh show frontend)"
          AI_TAG="v$(scripts/version.sh show ai-backend)"

          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
          echo "service=${SERVICE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "backend_tag=${BACKEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=${FRONTEND_TAG}" >> "$GITHUB_OUTPUT"
          echo "ai_tag=${AI_TAG}" >> "$GITHUB_OUTPUT"
          NS="${DOCKERHUB_NAMESPACE:-${DOCKERHUB_USERNAME:-tsermakov}}"
          echo "namespace=${NS}" >> "$GITHUB_OUTPUT"

  test:
    name: Release gate – tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'user-account'
        with:
          go-version-file: user-account/go.mod

      - name: User account tests
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'user-account'
        working-directory: user-account
        run: go test ./...

      - uses: actions/setup-node@v4
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'frontend'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templater/apps/web/package-lock.json

      - name: Web tests
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'frontend'
        working-directory: templater/apps/web
        run: |
          npm ci
          npm run test:unit

      - uses: actions/setup-python@v5
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'ai-backend'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            templater/apps/api/requirements.txt
            templater/apps/api/requirements-dev.txt

      - name: AI backend tests
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'ai-backend'
        working-directory: templater/apps/api
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest

  publish-images:
    name: Publish versioned images
    runs-on: ubuntu-latest
    needs: [validate, test]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check registry credentials
        id: creds
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push user-account backend
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'user-account'
        uses: docker/build-push-action@v6
        with:
          context: ./user-account
          push: true
          platforms: linux/amd64
          tags: |
            ${{ needs.validate.outputs.namespace }}/actium-user-account-backend:${{ needs.validate.outputs.backend_tag }}
            ${{ needs.validate.outputs.namespace }}/actium-user-account-backend:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.namespace }}/actium-user-account-backend:${{ github.sha }}

      - name: Push AI backend
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'ai-backend'
        uses: docker/build-push-action@v6
        with:
          context: ./templater/apps/api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ needs.validate.outputs.namespace }}/actium-ai-backend:${{ needs.validate.outputs.ai_tag }}
            ${{ needs.validate.outputs.namespace }}/actium-ai-backend:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.namespace }}/actium-ai-backend:${{ github.sha }}

      - name: Push frontend
        if: needs.validate.outputs.scope == 'all' || needs.validate.outputs.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: ./templater/apps/web
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
          tags: |
            ${{ needs.validate.outputs.namespace }}/actium-templater-frontend:${{ needs.validate.outputs.frontend_tag }}
            ${{ needs.validate.outputs.namespace }}/actium-templater-frontend:${{ needs.validate.outputs.version }}
            ${{ needs.validate.outputs.namespace }}/actium-templater-frontend:${{ github.sha }}

  bump-kustomize:
    name: Bump Kustomize image tags
    runs-on: ubuntu-latest
    needs: [validate, publish-images]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: imranismail/setup-kustomize@v2

      - name: Set image tags (production + minikube)
        env:
          SCOPE: ${{ needs.validate.outputs.scope }}
          SERVICE: ${{ needs.validate.outputs.service }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          NAMESPACE: ${{ needs.validate.outputs.namespace }}
        run: |
          chmod +x scripts/kustomize-set-image-tags.sh
          for OVERLAY in production minikube; do
            if [ "${SCOPE}" = "all" ]; then
              ./scripts/kustomize-set-image-tags.sh "${OVERLAY}" "${NAMESPACE}"
            else
              ./scripts/kustomize-set-image-tags.sh "${OVERLAY}" "${NAMESPACE}" \
                --service "${SERVICE}" --tag "${IMAGE_TAG}"
            fi
          done

      - name: Commit manifest bumps
        env:
          REF: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/overlays/production/kustomization.yaml
          git add infra/k8s/overlays/minikube/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No kustomize changes"
            exit 0
          fi
          git commit -m "chore(release): bump images for ${REF}"
          git push origin HEAD:master

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, publish-images, bump-kustomize]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Actium ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Images (${{ needs.validate.outputs.namespace }})

            | Service | Image tag |
            |---------|-----------|
            | User API | `${{ needs.validate.outputs.namespace }}/actium-user-account-backend:${{ needs.validate.outputs.backend_tag }}` |
            | Frontend | `${{ needs.validate.outputs.namespace }}/actium-templater-frontend:${{ needs.validate.outputs.frontend_tag }}` |
            | AI API | `${{ needs.validate.outputs.namespace }}/actium-ai-backend:${{ needs.validate.outputs.ai_tag }}` |

            Scope: **${{ needs.validate.outputs.scope }}** (${{ needs.validate.outputs.service }}).

  notify:
    name: Telegram release notification
    runs-on: ubuntu-latest
    needs: [validate, github-release]
    if: always()
    steps:
      - name: Check Telegram configured
        id: tg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: appleboy/telegram-action@v1.0.0
        if: steps.tg.outputs.enabled == 'true' && needs.github-release.result == 'success'
        with:
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Release ${{ github.ref_name }}
            backend=${{ needs.validate.outputs.backend_tag }} frontend=${{ needs.validate.outputs.frontend_tag }} ai=${{ needs.validate.outputs.ai_tag }}
            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
