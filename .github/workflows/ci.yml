name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  user-account-test:
    name: User Account – Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-account
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: user-account/go.mod

      - name: Run tests
        run: go test ./...

  user-account-build:
    name: User Account – Build
    runs-on: ubuntu-latest
    needs: user-account-test
    defaults:
      run:
        working-directory: user-account
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: user-account/go.mod

      - name: Build
        run: go build ./...

  web-test:
    name: Web – Test
    runs-on: ubuntu-latest
    needs: user-account-build
    defaults:
      run:
        working-directory: templater/apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templater/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

  web-build:
    name: Web – Build
    runs-on: ubuntu-latest
    needs: web-test
    defaults:
      run:
        working-directory: templater/apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: templater/apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-images-build:
    name: Docker Images - Buildx
    runs-on: ubuntu-latest
    needs:
      - user-account-build
      - web-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user-account image
        run: docker buildx build --platform linux/amd64 -t actium-user-account-backend:ci --load ./user-account

      - name: Build ai-backend image
        run: docker buildx build --platform linux/amd64 -t actium-ai-backend:ci --load ./templater/apps/api

      - name: Build frontend image
        run: docker buildx build --platform linux/amd64 --build-arg VITE_API_BASE_URL=http://localhost:8001 -t actium-templater-frontend:ci --load ./templater/apps/web

  docker-images-push:
    name: Docker Images - Push to Registry
    runs-on: ubuntu-latest
    needs:
      - docker-images-build
    if: github.event_name == 'push'
    permissions:
      contents: read
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_NAMESPACE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check registry credentials
        id: creds
        shell: bash
        run: |
          if [ -z "${DOCKERHUB_USERNAME}" ] || [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials are missing. Skipping push steps."
          else
            namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Docker Buildx
        if: steps.creds.outputs.available == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.creds.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push user-account image
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./user-account
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.creds.outputs.namespace }}/actium-user-account-backend:${{ github.sha }}

      - name: Push ai-backend image
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./templater/apps/api
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.creds.outputs.namespace }}/actium-ai-backend:${{ github.sha }}

      - name: Push frontend image
        if: steps.creds.outputs.available == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./templater/apps/web
          push: true
          platforms: linux/amd64
          build-args: |
            VITE_API_BASE_URL=http://localhost:8001
          tags: |
            ${{ steps.creds.outputs.namespace }}/actium-templater-frontend:${{ github.sha }}

