apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: actium-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-configmap-reader
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-configmap-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-configmap-reader
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: actium-monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: actium-monitoring
  labels:
    app: grafana
    component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: monitoring
    spec:
      serviceAccountName: grafana
      containers:
        - name: grafana
          image: grafana/grafana:latest
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: sc-dashboard-volume
              mountPath: /tmp/dashboards
            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true

        - name: grafana-sc-dashboard
          image: kiwigrid/k8s-sidecar:1.28.0
          env:
            - name: METHOD
              value: WATCH
            - name: LABEL
              value: grafana_dashboard
            - name: FOLDER
              value: /tmp/dashboards
            - name: RESOURCE
              value: configmap
            - name: NAMESPACE
              value: actium-monitoring
            - name: FOLDER_ANNOTATION
              value: grafana_folder
          volumeMounts:
            - name: sc-dashboard-volume
              mountPath: /tmp/dashboards
      volumes:
        - name: sc-dashboard-volume
          emptyDir: {}
        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: datasource.yaml
                path: datasources/datasource.yaml
              - key: provider.yaml
                path: dashboards/provider.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: actium-monitoring
  labels:
    app: grafana
    component: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
      nodePort: 30300

