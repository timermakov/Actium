apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-backend
  namespace: actium-backend
  labels:
    app: ai-backend
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-backend
  template:
    metadata:
      labels:
        app: ai-backend
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8001"
    spec:
      containers:
        - name: ai-api
          image: mgfallen/actium-ai-backend:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          envFrom:
            - configMapRef:
                name: backend-config
                optional: true
          ports:
            - name: http-metrics
              containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: ai-backend
  namespace: actium-backend
  labels:
    app: ai-backend
    component: backend
spec:
  selector:
    app: ai-backend
  ports:
    - name: http-metrics
      protocol: TCP
      port: 8001
      targetPort: 8001
