apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-frontend
  namespace: actium-monitoring
  labels:
    grafana_dashboard: "1"
    app: frontend
    team: frontend
data:
  frontend-metrics.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "title": "Frontend Pod Resources",
          "type": "row"
        },
        {
          "type": "timeseries",
          "title": "CPU Request by Pod",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"cpu\", container=\"web\"}",
              "legendFormat": "{{pod}} - request",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0 },
            "overrides": []
          }
        },
        {
          "type": "timeseries",
          "title": "Memory Request by Pod (MiB)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"memory\", container=\"web\"} / 1024 / 1024",
              "legendFormat": "{{pod}} - request",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "mebibytes", "min": 0 },
            "overrides": []
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 },
          "title": "Pod Status",
          "type": "row"
        },
        {
          "type": "stat",
          "title": "Pod Status",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 10 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_status_phase{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "legendFormat": "{{pod}} - {{phase}}",
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Pod Restarts",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 10 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "legendFormat": "{{pod}}/{{container}}",
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "type": "stat",
          "title": "Container Ready",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 10 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_status_ready{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "legendFormat": "{{pod}}/{{container}}",
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "type": "table",
          "title": "Pod Resource Details",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 14 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_resource_limits{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "format": "table",
              "instant": true,
              "refId": "B"
            }
          ],
          "transformations": [
            {
              "id": "merge",
              "options": {}
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "endpoint": true,
                  "job": true,
                  "service": true,
                  "uid": true
                },
                "renameByName": {
                  "namespace": "Namespace",
                  "pod": "Pod",
                  "container": "Container",
                  "resource": "Resource",
                  "Value #A": "Request",
                  "Value #B": "Limit"
                }
              }
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["frontend", "actium"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "query": "label_values(kube_pod_container_resource_requests{pod=~\"frontend.*\"}, namespace)",
            "multi": false,
            "includeAll": false,
            "label": "Namespace",
            "refresh": 1,
            "datasource": { "type": "prometheus" },
            "current": { "text": "actium-frontend", "value": "actium-frontend" }
          },
          {
            "name": "pod",
            "type": "query",
            "query": "label_values(kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"frontend.*\"}, pod)",
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "label": "Pod",
            "refresh": 1,
            "datasource": { "type": "prometheus" },
            "current": { "text": ["All"], "value": ["$__all"] }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "Frontend: Pod Resources",
      "uid": "frontend-001",
      "version": 1
    }
