apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-account-backend
  namespace: actium-backend
  labels:
    app: user-account-backend
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-account-backend
  template:
    metadata:
      labels:
        app: user-account-backend
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: mgfallen/actium-user-account-backend:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: backend-config
                optional: true
          env:
            - name: DB_HOST
              value: "db.actium-database.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8080"
          ports:
            - name: http-metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-account-backend
  namespace: actium-backend
  labels:
    app: user-account-backend
    component: backend
spec:
  selector:
    app: user-account-backend
  ports:
    - name: http-metrics
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-backend-hpa
  namespace: actium-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-account-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 15
