apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actium-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: actium.local
      http:
        paths:
          - path: /api/user/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-account-backend
                port:
                  number: 8080
          - path: /api/ai/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ai-backend
                port:
                  number: 8001
          - path: /?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: frontend
                port:
                  number: 80