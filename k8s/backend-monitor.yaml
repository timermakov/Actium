apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-account-backend-monitor
  namespace: monitoring
  labels:
    release: my-release
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: user-account-backend
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: 15s