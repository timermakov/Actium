apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-user-backend
  namespace: actium-monitoring
  labels:
    grafana_dashboard: "1"
    app: user-account-srv
    team: backend
data:
  user-backend-metrics.json: |-
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "title": "API Metrics",
          "type": "row"
        },
        {
          "title": "Requests Rate (RPS) by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(http_requests_total{pod=~\"$pod\"}[5m])) by (path, method)",
              "legendFormat": "{{method}} {{path}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] }
          },
          "fieldConfig": {
            "defaults": { "unit": "reqps" },
            "overrides": []
          }
        },
        {
          "title": "Error Rate by Status Code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(http_requests_total{pod=~\"$pod\", status=~\"4..|5..\"}[5m])) by (status, path)",
              "legendFormat": "{{status}} {{path}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] }
          },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "axisColor": "red" } },
            "overrides": []
          }
        },
        {
          "title": "Request Latency P95 by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{pod=~\"$pod\"}[5m])) by (le, path))",
              "legendFormat": "P95 {{path}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] }
          },
          "fieldConfig": {
            "defaults": { "unit": "s", "min": 0 },
            "overrides": []
          }
        },
        {
          "title": "Request Latency P99 by Endpoint",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{pod=~\"$pod\"}[5m])) by (le, path))",
              "legendFormat": "P99 {{path}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] }
          },
          "fieldConfig": {
            "defaults": { "unit": "s", "min": 0 },
            "overrides": []
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "title": "Pod Resources",
          "type": "row"
        },
        {
          "title": "CPU Request by Pod",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"cpu\", container=\"backend\"}",
              "legendFormat": "{{pod}} - request",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "min": 0 },
            "overrides": []
          }
        },
        {
          "title": "Memory Request by Pod (MiB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"$pod\", resource=\"memory\", container=\"backend\"} / 1024 / 1024",
              "legendFormat": "{{pod}} - request",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "mebibytes", "min": 0 },
            "overrides": []
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "title": "Pod Status",
          "type": "row"
        },
        {
          "title": "Pod Status",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 27 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_status_phase{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "legendFormat": "{{pod}} - {{phase}}",
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "title": "Pod Restarts",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 27 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_status_restarts_total{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "legendFormat": "{{pod}}/{{container}}",
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "title": "Container Ready",
          "type": "stat",
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 27 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "kube_pod_container_status_ready{namespace=~\"$namespace\", pod=~\"$pod\"}",
              "legendFormat": "{{pod}}/{{container}}",
              "refId": "A"
            }
          ],
          "options": {
            "graphMode": "area",
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": { "unit": "none" },
            "overrides": []
          }
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "title": "Business Metrics",
          "type": "row"
        },
        {
          "title": "API Endpoint Calls",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 32 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(api_endpoint_calls_total{pod=~\"$pod\"}[5m])) by (endpoint)",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] }
          },
          "fieldConfig": {
            "defaults": { "unit": "reqps" },
            "overrides": []
          }
        },
        {
          "title": "Auth Events",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 32 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(api_auth_events_total{pod=~\"$pod\"}[5m])) by (event, status)",
              "legendFormat": "{{event}} - {{status}}",
              "refId": "A"
            }
          ],
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom" }
          },
          "fieldConfig": {
            "defaults": { "unit": "reqps" },
            "overrides": []
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 36,
      "style": "dark",
      "tags": ["user-backend", "api", "actium"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "query": "label_values(kube_pod_container_resource_requests{pod=~\"user-account-srv.*\"}, namespace)",
            "multi": false,
            "includeAll": false,
            "label": "Namespace",
            "refresh": 1,
            "datasource": { "type": "prometheus" },
            "current": { "text": "actium-backend", "value": "actium-backend" }
          },
          {
            "name": "pod",
            "type": "query",
            "query": "label_values(kube_pod_status_phase{namespace=~\"$namespace\", pod=~\"user-account-srv.*\", phase=\"Running\"}, pod)",
            "multi": true,
            "includeAll": false,
            "allValue": ".*",
            "label": "Pod",
            "refresh": 1,
            "datasource": { "type": "prometheus" },
            "current": { "text": ["All"], "value": ["$__all"] }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "User Backend: API & Pod Resources",
      "uid": "user-backend-001",
      "version": 1
    }
