apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actium-backend-ingress
  namespace: actium-backend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - http:
        paths:
          - path: /api/user(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-account-backend
                port:
                  number: 8080
          - path: /api/ai(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ai-backend
                port:
                  number: 8001
