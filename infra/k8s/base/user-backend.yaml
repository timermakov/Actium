apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-account-backend
  namespace: actium-backend
  labels:
    app: user-account-backend
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-account-backend
  template:
    metadata:
      labels:
        app: user-account-backend
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      initContainers:
        - name: db-migrate
          image: tsermakov/actium-user-account-backend:v1.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          command: ["/bin/sh", "-c"]
          args:
            - |
              DSN="host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} sslmode=disable"
              i=1
              while [ "$i" -le 30 ]; do
                if /app/goose -dir /app/migrations postgres "$DSN" up; then
                  exit 0
                fi
                echo "Migration attempt $i failed, retrying..."
                sleep 2
                i=$((i + 1))
              done
              exit 1
          envFrom:
            - configMapRef:
                name: backend-config
                optional: true
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
      containers:
        - name: backend
          image: tsermakov/actium-user-account-backend:v1.0.2
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: backend-config
                optional: true
          env:
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8080"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_SECRET
          ports:
            - name: http-metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: user-account-backend
  namespace: actium-backend
  labels:
    app: user-account-backend
    component: backend
spec:
  selector:
    app: user-account-backend
  ports:
    - name: http-metrics
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-backend-hpa
  namespace: actium-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-account-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 15
