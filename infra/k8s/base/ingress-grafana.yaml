apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actium-grafana-ingress
  namespace: actium-monitoring
spec:
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
