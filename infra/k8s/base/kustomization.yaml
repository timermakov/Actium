apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - postgres-credentials.yaml
  - postgres.yaml
  - postgres-network-policy.yaml
  - backend-secret.yaml
  - network-policies.yaml
  - user-account-srv.yaml
  - ai-srv.yaml
  - frontend.yaml
  - migration-job.yaml
  - prometheus.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - grafana-provisioning.yaml
  - grafana-dashboard-user-backend.yaml
  - grafana-dashboard-frontend.yaml
  - grafana-dashboard-k8s-pods.yaml
  - grafana-dashboard-api-overview.yaml
  - grafana.yaml
  - ingress-backend.yaml
  - ingress-grafana.yaml
  - ingress-frontend.yaml
  # SonarQube resources
  - sonarqube-namespace.yaml
  - sonarqube-secrets.yaml
  - sonarqube-postgres-pvc.yaml
  - sonarqube-postgres.yaml
  - sonarqube-app-pvc.yaml
  - sonarqube-config.yaml
  - sonarqube-app.yaml
  - sonarqube-ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: actium
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false