apiVersion: v1
kind: ConfigMap
metadata:
  name: sonarqube-config
  namespace: sonarqube
data:
  # Database settings
  SONAR_JDBC_URL: "jdbc:postgresql://sonarqube-postgres:5432/sonarqube"
  # Disable ES bootstrap checks for single-node setup
  SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
  # Web context (empty for root)
  SONAR_WEB_CONTEXT: ""
  # Search settings
  SONAR_SEARCH_JAVAOPTS: "-Xmx2048m -Xms512m"
  # CE settings
  SONAR_CE_JAVAOPTS: "-Xmx2048m -Xms512m"
  # Web settings
  SONAR_WEB_JAVAOPTS: "-Xmx2048m -Xms512m"
