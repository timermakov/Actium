apiVersion: batch/v1
kind: Job
metadata:
  name: user-account-db-migrate
  namespace: actium-backend
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: migrate
          image: tsermakov/actium-user-account-backend:v1.0.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              DSN="host=${DB_HOST} port=${DB_PORT} user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} sslmode=disable"
              i=1
              while [ "$i" -le 30 ]; do
                if /app/goose -dir /app/migrations postgres "$DSN" up; then
                  exit 0
                fi
                echo "Migration attempt $i failed, retrying..."
                sleep 2
                i=$((i + 1))
              done
              exit 1
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DB_PASSWORD
      restartPolicy: OnFailure
