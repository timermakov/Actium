# Publish SonarQube NodePort (minikube) on the VM NIC.
#
#   sudo cp infra/k8s/nginx/sonarqube-publish.conf /etc/nginx/sites-available/sonarqube
#   sudo ln -sf /etc/nginx/sites-available/sonarqube /etc/nginx/sites-enabled/sonarqube
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prefer nginx over kubectl port-forward (stable under parallel CI scans).
# Open TCP/9090 in cloud security group for GitHub Actions.

server {
    listen 0.0.0.0:9090;
    server_name _;

    client_max_body_size 64m;

    location / {
        proxy_pass http://192.168.49.2:30080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
