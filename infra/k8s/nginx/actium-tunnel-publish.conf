# Optional: publish minikube tunnel (127.0.0.1:80) on the VM NIC (not loopback).
# Ingress rules from infra/k8s/base/ingress-*.yaml still handle routing.
#
#   BIND_IP=$(hostname -I | awk '{print $1}')
#   sed "s/BIND_IP/$BIND_IP/" infra/k8s/nginx/actium-tunnel-publish.conf \
#     | sudo tee /etc/nginx/sites-available/actium
#   sudo ln -sf /etc/nginx/sites-available/actium /etc/nginx/sites-enabled/actium
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl enable --now nginx

server {
    listen BIND_IP:80 default_server;
    server_name _;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
