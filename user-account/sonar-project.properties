# SonarQube Configuration for Actium User Account (Go)

# Project identification
sonar.projectKey=actium-user-account
sonar.projectName=Actium User Account
# CI overrides from versions.yaml; local default:
sonar.projectVersion=1.1.0

# Source code
sonar.sources=.
sonar.exclusions=**/*_test.go,**/mocks/**,**/vendor/**,**/docs/**,**/gen/**

# Tests
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**

# Coverage - use native Go coverage format (coverage.out)
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=**/*_test.go,**/mocks/**,**/cmd/**,**/main.go

# Language
sonar.language=go

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Issue settings
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**

# Duplications
sonar.cpd.exclusions=**/*_test.go,**/mocks/**

# Security
sonar.security.hotspots.active=true
