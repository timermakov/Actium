# SonarQube Configuration for Actium AI Backend (Python/FastAPI)

# Project identification
sonar.projectKey=actium-ai-backend
sonar.projectName=Actium AI Backend
# CI overrides from versions.yaml; local default:
sonar.projectVersion=1.0.0

# Source code
sonar.sources=.
sonar.exclusions=tests/**,**/__pycache__/**,.venv/**,venv/**,**/.env*,vercel.json,Dockerfile,.dockerignore,requirements-dev.txt,pytest.ini

# Tests
sonar.tests=tests
sonar.test.inclusions=tests/**/*
sonar.test.exclusions=

# Coverage
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=tests/**

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Security
sonar.security.hotspots.active=true
