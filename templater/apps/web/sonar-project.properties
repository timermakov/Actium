# SonarQube Configuration for Actium Web Frontend (TypeScript/React)

# Project identification
sonar.projectKey=actium-web
sonar.projectName=actium-web
# CI overrides from versions.yaml; local default:
sonar.projectVersion=1.2.0

# Source code
sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**

# Tests
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.test.exclusions=node_modules/**,dist/**,build/**

# Coverage
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage only on testable logic (aligned with vitest coverage include)
sonar.coverage.exclusions=\
  src/App.tsx,\
  src/main.tsx,\
  src/app/**,\
  src/components/**,\
  src/pages/**,\
  src/i18n/**,\
  src/types/**,\
  src/shared/LanguageSwitch.tsx,\
  src/shared/SectionCard.tsx,\
  src/features/ai/**,\
  src/features/auth/AuthProvider.tsx,\
  src/features/auth/LoginCard.tsx,\
  src/features/auth/LogoutCard.tsx,\
  src/features/auth/RegisterCard.tsx,\
  src/features/auth/useAuth.tsx,\
  src/features/data/**,\
  src/features/generation/**,\
  src/features/insights/**,\
  src/features/mapping/**,\
  src/features/template/**,\
  src/features/users/UserManagmentPage.tsx,\
  src/features/users/useUsers.tsx

# Language
sonar.language=ts

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# TypeScript specific
sonar.typescript.tsconfigPath=tsconfig.json

# Duplications
sonar.cpd.exclusions=tests/**,**/*.test.ts,**/*.test.tsx

# Security
sonar.security.hotspots.active=true

# React specific settings
sonar.react.file.suffix=.tsx
